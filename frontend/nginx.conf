server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Using a variable in proxy_pass below
    # forces nginx to resolve "backend" at REQUEST time via this resolver,
    # instead of once at config-load/startup time. Without this, nginx
    # fails to start at all if the backend container's DNS entry isn't
    # already present the instant nginx boots a real race condition in
    # docker-compose, not a hypothetical one.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback any non-file, non-/api route serves index.html so
    # React Router's client-side routes work on
    # a hard refresh instead of 404ing at the nginx level.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

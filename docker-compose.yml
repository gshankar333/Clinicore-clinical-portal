services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinico_healthcare_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clinico_healthcare_portal
      JWT_SECRET: supersecret123
      JWT_EXPIRES_IN: 7d
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  seeder:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clinico_healthcare_portal
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "node db/reset-demo-data.js && node db/seed-demo-full.js"]
    profiles: ["seed"]

volumes:
  pgdata:

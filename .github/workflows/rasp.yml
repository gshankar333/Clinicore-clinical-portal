name: RASP - Production Simulation
# Runs the backend in a production-like configuration (RASP_MODE=on, NODE_ENV=production, IAST off - IAST is a
# test-time tool, not something you'd run in prod) and asserts, not just
# logs, that real attacks get blocked while legitimate traffic passes.
#
# This is the strictest gate in the whole pipeline: it fails if RASP
# either under-blocks (an attack got through) OR over-blocks (a
# legitimate request got rejected) - both are real regressions.

on:
  push:

  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  rasp:
    name: Production simulation - assert blocking + no false positives
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Apply schema and seed data
        working-directory: backend
        env:
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
        run: |
          node db/run-sql.js db/schema.sql
          node db/run-sql.js db/seed.sql
          node db/reset-demo-data.js
          node db/seed-demo-full.js

      - name: Start backend in production-simulation mode
        working-directory: backend
        env:
          PORT: 4000
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          NODE_ENV: production
          RASP_MODE: "on"
          RASP_LOG_PATH: ${{ github.workspace }}/backend/rasp-findings.jsonl
        run: |
          nohup env RASP_MODE=on NODE_ENV=production DATABASE_URL="$DATABASE_URL" JWT_SECRET="$JWT_SECRET" JWT_EXPIRES_IN="$JWT_EXPIRES_IN" RASP_LOG_PATH="$RASP_LOG_PATH" node src/server.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become ready in time."
          cat server.log
          exit 1

      - name: Exercise attacks + legitimate traffic, assert correct blocking
        working-directory: backend
        env:
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
        run: node scripts/rasp-exercise.js

      - name: Upload RASP findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rasp-findings
          path: backend/rasp-findings.jsonl

      - name: Dump backend log on failure
        if: failure()
        run: cat backend/server.log
